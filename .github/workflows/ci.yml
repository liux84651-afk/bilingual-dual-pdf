name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pypdfium2 Pillow

      - name: Syntax check
        run: python -m py_compile scripts/*.py

      - name: Skill frontmatter sanity
        run: |
          python - <<'PY'
          import re, pathlib
          text = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---"), "SKILL.md must start with YAML frontmatter"
          fm = text.split("---", 2)[1]
          assert re.search(r"^name:\s*bilingual-dual-pdf", fm, re.M), "missing/incorrect name"
          assert re.search(r"^description:\s*\S+", fm, re.M), "missing description"
          print("SKILL.md frontmatter OK")
          PY

      - name: Demo pipeline (extract -> md -> html/pdf)
        run: |
          cd examples/demo
          python ../../scripts/mdgen.py --work . --out bilingual.md
          python ../../scripts/md2pdf.py --md bilingual.md --pdf bilingual-demo.pdf || echo "browser unavailable, HTML only"
          python ../../scripts/verify.py --work . --pdf bilingual-demo.pdf || true

      - name: Upload demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: |
            examples/demo/bilingual.md
            examples/demo/bilingual.html
            examples/demo/bilingual-demo.pdf
          if-no-files-found: warn
